name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      # API specs create (and drop) their own database on this server.
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0 (version from package.json "packageManager")
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @itam/shared build
      - run: pnpm -r typecheck
      - name: API tests (unit, database integrity, end to end)
        run: pnpm --filter @itam/api test
      - name: Discovery worker tests (real in-process SSH server and SNMP agent)
        run: pnpm --filter @itam/discovery-worker test
      - name: Web tests
        run: pnpm --filter @itam/web test
      - name: Web production build
        run: pnpm --filter @itam/web build

  images:
    name: Image ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [api, dispatcher, web, worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: itam/${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id itam/${{ matrix.target }}:ci -u)" != "0"
      - name: Prisma engines are baked in (no runtime downloads)
        if: matrix.target == 'api'
        run: docker run --rm --network none --entrypoint node_modules/.bin/prisma itam/api:ci version | grep -q "schema-engine-debian-openssl-3.0.x"
