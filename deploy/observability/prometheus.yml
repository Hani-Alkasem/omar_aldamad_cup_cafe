# Scrapes the compose stack. Replicas behind a service name are all scraped via DNS service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: itam-api
    metrics_path: /api/v1/metrics
    dns_sd_configs: [{ names: [api], type: A, port: 4000 }]
    # If METRICS_TOKEN is set on the API:
    # authorization: { credentials_file: /etc/prometheus/metrics-token }
  - job_name: itam-dispatcher
    dns_sd_configs: [{ names: [dispatcher], type: A, port: 9464 }]
  - job_name: itam-worker
    dns_sd_configs: [{ names: [worker], type: A, port: 9465 }]

rule_files: [/etc/prometheus/alerts.yml]
